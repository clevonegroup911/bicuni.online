name: BICUNI CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: bicuni-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bicuni
          POSTGRES_PASSWORD: static-ci-password
          POSTGRES_DB: bicuni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bicuni -d bicuni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bicuni:static-ci-password@127.0.0.1:5432/bicuni?schema=public
      OAAS_ALLOW_TEST_PAYMENTS: "1"
      AUTH_SECRET: static-ci-auth-secret-not-real-use-only-in-ci
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      PUBLIC_APP_URL: http://127.0.0.1:3100
      PLAYWRIGHT_SKIP_WEBSERVER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed OaaS TEST catalogue
        run: |
          if [ -f scripts/seed-oaas.mjs ]; then
            npm run db:seed:oaas
          else
            echo "Seed OaaS absent sur cette branche — ignoré."
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        if: hashFiles('e2e/oaas-academic-research.spec.ts') != ''
        run: npx playwright install --with-deps chromium

      - name: Start app for E2E
        if: hashFiles('e2e/oaas-academic-research.spec.ts') != ''
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/bicuni-e2e-server.log 2>&1 &
          echo $! > /tmp/bicuni-e2e.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start"
          tail -n 200 /tmp/bicuni-e2e-server.log || true
          exit 1

      - name: E2E OaaS
        if: hashFiles('e2e/oaas-academic-research.spec.ts') != ''
        run: |
          set -euo pipefail
          test -f e2e/oaas-academic-research.spec.ts
          test -f e2e/oaas-outcomes-responsive.spec.ts
          echo "Running Playwright files:"
          echo " - e2e/oaas-academic-research.spec.ts"
          echo " - e2e/oaas-outcomes-responsive.spec.ts"
          npx playwright test \
            e2e/oaas-academic-research.spec.ts \
            e2e/oaas-outcomes-responsive.spec.ts \
            --project=desktop \
            --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

      - name: Upload Playwright artifacts
        if: failure() && hashFiles('e2e/oaas-academic-research.spec.ts') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-oaas-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/bicuni-e2e-server.log
          if-no-files-found: ignore

      - name: Stop app
        if: always() && hashFiles('e2e/oaas-academic-research.spec.ts') != ''
        run: |
          if [ -f /tmp/bicuni-e2e.pid ]; then kill "$(cat /tmp/bicuni-e2e.pid)" || true; fi

      - name: Verify generated files and formatting
        run: |
          git diff --check
          if ! git diff --exit-code; then
            echo "::error::Tracked files changed during CI. next-env.d.ts and tsconfig.json must remain stable after build."
            git status --short
            exit 1
          fi

  secret-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build web image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: bicuni-ci:${{ github.sha }}

      - name: Smoke web image with Prisma and healthchecks
        run: |
          image="bicuni-ci:${{ github.sha }}"
          docker run --rm \
            -e DATABASE_URL='postgresql://bicuni:static-ci-password@127.0.0.1:5432/bicuni?schema=public' \
            "$image" \
            node -e 'const { PrismaClient } = require("@prisma/client"); const client = new PrismaClient(); console.log("Prisma client initialized"); client.$disconnect()'
          container="bicuni-runner-${{ github.run_id }}"
          docker run --rm -d --name "$container" -p 127.0.0.1:3100:3000 \
            -e DATABASE_URL='postgresql://bicuni:static-ci-password@127.0.0.1:5432/bicuni?schema=public' \
            -e AUTH_SECRET='static-ci-smoke-secret-not-real' \
            -e PUBLIC_APP_URL='http://127.0.0.1:3100' \
            "$image"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live > /tmp/live.json; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /tmp/live.json --write-out '%{http_code}' http://127.0.0.1:3100/api/health/live)" = "200"
          test "$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:3100/api/health/ready)" = "503"
          grep -q '"database":"unavailable"' /tmp/ready.json
          grep -q '"redis":"unavailable"' /tmp/ready.json

      - name: Scan web image (high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bicuni-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy web report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-web-${{ github.sha }}
          path: trivy-results*
          if-no-files-found: ignore

      - name: Build operations image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: operations
          load: true
          push: false
          tags: bicuni-operations-ci:${{ github.sha }}

      - name: Scan operations image (high and critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bicuni-operations-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
