services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bicuni
      POSTGRES_PASSWORD: bicuni-local
      POSTGRES_DB: bicuni
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  meilisearch:
    image: getmeili/meilisearch:v1.51.0
    environment: [MEILI_ENV=development, MEILI_MASTER_KEY=bicuni-local-search-key]
    ports: ["7700:7700"]
    volumes: [meilisearch_data:/meili_data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
volumes:
  postgres_data:
  meilisearch_data:
  redis_data:
