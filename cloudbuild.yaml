steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/web:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/web:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "bicuni-web", "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/web:$COMMIT_SHA", "--region", "${_REGION}", "--platform", "managed", "--allow-unauthenticated"]
substitutions:
  _REGION: europe-west1
images: ["${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/web:$COMMIT_SHA"]
