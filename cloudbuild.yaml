steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/bicuni:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/bicuni:$COMMIT_SHA

substitutions:
  _REGION: europe-west1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/bicuni/bicuni:$COMMIT_SHA
